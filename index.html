<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master iCanStudy Flowchart Engine</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #2f3437;
      --card-bg: #f7f6f3;
      --border-color: #e9e9e7;
      --accent-color: #2eaadc;
      --drawer-width: 380px;
    }
    body.dark-mode {
      --bg-color: #191919;
      --text-color: #d4d4d4;
      --card-bg: #202020;
      --border-color: #2f2f2f;
      --accent-color: #529cca;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; touch-action: none; }

    /* TOOLBAR CONTROL */
    #toolbar {
      height: 50px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
      z-index: 10;
    }
    .btn {
      padding: 6px 9px; border-radius: 4px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn:hover:not(:disabled) { background: var(--accent-color); color: white; border-color: var(--accent-color); }
    .btn.active { background: var(--accent-color); color: white; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-nav { font-size: 12px; padding: 6px 8px; }

    /* NÚT GHI CHÚ SMARTER */
    .btn-note {
      opacity: 0.4;
      pointer-events: none;
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--border-color);
    }
    .btn-note.ready {
      opacity: 1;
      pointer-events: auto;
      background: #ff9800 !important;
      color: white !important;
      border-color: #f57c00 !important;
      animation: pulse-glow 1.5s infinite;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(255, 152, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
    }

    #search-input {
      padding: 6px 8px; border-radius: 4px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); font-size: 12px; outline: none; width: 120px;
    }

    #main-container { width: 100%; height: calc(100vh - 50px); min-height: 550px; position: relative; display: flex; }
    #network { width: 100%; height: 100%; min-height: 550px; background-color: var(--bg-color); cursor: grab; }
    #network:active { cursor: grabbing; }

    /* SLIDE-OUT DRAWER WITH LOCK FEATURE */
    #drawer {
      position: absolute; top: 0; right: 0; width: var(--drawer-width); height: 100%;
      background: var(--card-bg); border-left: 1px solid var(--border-color);
      box-shadow: -4px 0 15px rgba(0,0,0,0.08); transform: translateX(100%);
      transition: transform 0.3s ease; z-index: 20; padding: 15px 20px; overflow-y: auto;
    }
    #drawer.open { transform: translateX(0); }
    
    #drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;
    }
    #btn-lock { font-size: 12px; padding: 4px 8px; }
    #drawer-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-color); }
    
    #drawer-content { line-height: 1.6; font-size: 14px; min-height: 200px; }
    #drawer-content[contenteditable="true"] {
      outline: 2px dashed #ff9800;
      padding: 10px;
      border-radius: 6px;
      background: rgba(255, 152, 0, 0.05);
    }
    
    .status-guide { font-size: 11px; color: #777; margin-left: auto; font-weight: 500; }
  </style>
</head>
<body>

  <div id="toolbar">
    <button class="btn active" id="btn-mode" onclick="cycleMode()">🌐 Dạng 2: Hệ thống</button>
    <button class="btn btn-nav" id="btn-undo" onclick="undoState()" disabled>◀ Trước</button>
    <button class="btn btn-nav" id="btn-redo" onclick="redoState()" disabled>Sau ▶</button>
    <button class="btn btn-note" id="btn-note" onclick="toggleDrawerForSelected()">📝 Xem Ghi Chú</button>
    <button class="btn" id="btn-recall" onclick="toggleActiveRecall()">❓ Active Recall</button>
    <input type="text" id="search-input" placeholder="🔍 (B) hoặc A-->B" oninput="handleSearch(this.value)">
    <button class="btn" onclick="resetView()">🔄 Reset</button>
    <button class="btn" onclick="toggleDarkMode()">🌙/☀️</button>
    <span class="status-guide" id="guide-text">💻 Chuột phải / 📱 2 Ngón tay để xoay 360°</span>
  </div>

  <div id="main-container">
    <div id="network"></div>
    <div id="drawer">
      <div id="drawer-header">
        <button class="btn" id="btn-lock" onclick="toggleNoteLock()">🔒 Chỉ đọc</button>
        <button id="drawer-close" onclick="closeDrawer()">✕</button>
      </div>
      <div id="drawer-content" contenteditable="false">Chưa chọn nút nào.</div>
    </div>
  </div>

  <script>
    let network = null;
    let nodesDataSet = new vis.DataSet();
    let edgesDataSet = new vis.DataSet();
    
    let currentMode = 2;
    let isActiveRecall = false;
    let selectedNodeData = null;
    let activeSecondaryNodeId = null;
    let clickTimeout = null;
    let isNoteEditable = false;

    let activePathNodeIds = new Set();
    let activePathEdgeIds = new Set();

    let historyStack = [];
    let historyIndex = -1;
    let isNavigatingHistory = false;

    let basePositions = null;
    let centerPos = { x: 0, y: 0 };
    let isRotating = false;
    let startAngle = 0;
    let currentRotation = 0;

    const defaultData = {
      "nodes": [
        { "id": 1, "label": "Vi khuẩn Gram-âm", "level": 1, "group": "target", "tooltip": "💡 Nút chính Bậc 1", "detail": "<h3>📌 Vi khuẩn Gram-âm</h3><p>Có vách tế bào kép đặc trưng gồm màng ngoài và peptidoglycan.</p>" },
        { "id": 2, "label": "Kênh Porin", "level": 2, "group": "structure", "tooltip": "💡 Cửa ngõ qua màng", "detail": "<h3>🚪 Kênh Porin</h3><p>Kênh vận chuyển chất thân nước đi qua màng ngoài.</p>" },
        { "id": 3, "label": "Vách Peptidoglycan", "level": 2, "group": "structure", "tooltip": "💡 Bổ trợ vách", "detail": "<h3>🧱 Vách Peptidoglycan</h3><p>Đích tác dụng của nhiều kháng sinh diệt khuẩn.</p>" },
        { "id": 4, "label": "KS Beta-lactam", "level": 1, "group": "drug", "tooltip": "💡 Nút chính Bậc 1", "detail": "<h3>💊 Kháng sinh Beta-lactam</h3><p>Nhóm kháng sinh diệt khuẩn mạnh bằng cách ức chế vách.</p>" },
        { "id": 5, "label": "Ức chế Enzyme PBP", "level": 2, "group": "mechanism", "tooltip": "💡 Cơ chế tác dụng", "detail": "<h3>🛠️ Enzyme PBP</h3><p>PBP bị gắn chặt làm ngưng tổng hợp peptidoglycan.</p>" },
        { "id": 6, "label": "Tiết Beta-lactamase", "level": 2, "group": "resistance", "tooltip": "💡 Cơ chế đề kháng", "detail": "<h3>✂️ Beta-lactamase</h3><p>Thủy phân vòng beta-lactam khiến kháng sinh mất tác dụng.</p>" }
      ],
      "edges": [
        { "id": "e1-2", "from": 1, "to": 2, "label": "Chứa", "isMain": true },
        { "id": "e1-3", "from": 1, "to": 3, "label": "Bao bọc", "isMain": true },
        { "id": "e4-5", "from": 4, "to": 5, "label": "Cơ chế chính", "isMain": true },
        { "id": "e5-3", "from": 5, "to": 3, "label": "Phá hủy vách", "isMain": true },
        { "id": "e4-2", "from": 4, "to": 2, "label": "Thấm qua", "isMain": false },
        { "id": "e6-4", "from": 6, "to": 4, "label": "Đề kháng mạnh", "isMain": false, "isImportant": true }
      ]
    };

    const groupColors = {
      target: { background: '#1976d2', border: '#0d47a1', fontColor: '#ffffff' },
      drug: { background: '#2e7d32', border: '#1b5e20', fontColor: '#ffffff' },
      structure: { background: '#f3e5f5', border: '#ab47bc', fontColor: '#2f3437' },
      mechanism: { background: '#fff9c4', border: '#fbc02d', fontColor: '#2f3437' },
      resistance: { background: '#ffebee', border: '#ef5350', fontColor: '#2f3437' }
    };

    async function fetchLessonData() {
      const urlParams = new URLSearchParams(window.location.search);
      const jsonPath = urlParams.get('lesson');
      if (!jsonPath) return defaultData;

      try {
        const response = await fetch(jsonPath);
        if (!response.ok) throw new Error("Không tìm thấy file JSON bài học!");
        return await response.json();
      } catch (err) {
        console.error("Lỗi nạp bài học:", err);
        return {
          "nodes": [{ "id": 1, "label": "⚠️ Lỗi nạp bài học", "level": 1, "group": "resistance", "tooltip": "Lỗi", "detail": `<h3>⚠️ Không tải được dữ liệu bài học</h3><p>Đường dẫn <code>${jsonPath}</code> không tồn tại trên GitHub.</p>` }],
          "edges": []
        };
      }
    }

    async function initNetwork() {
      const rawData = await fetchLessonData();

      const processedNodes = rawData.nodes.map(node => {
        const isLevel1 = node.level === 1;
        const colorConfig = groupColors[node.group] || { background: '#ffffff', border: '#cccccc', fontColor: '#2f3437' };
        return {
          id: node.id,
          label: node.label,
          originalLabel: node.label,
          title: node.tooltip,
          detail: node.detail,
          level: node.level,
          group: node.group,
          color: { background: colorConfig.background, border: colorConfig.border },
          font: { size: isLevel1 ? 15 : 12.5, color: colorConfig.fontColor, bold: isLevel1 },
          shape: 'box',
          margin: isLevel1 ? 12 : 8,
          borderWidth: isLevel1 ? 2.5 : 1.5
        };
      });

      const processedEdges = rawData.edges.map(edge => {
        const isMainOrImportant = edge.isMain || edge.isImportant;
        return {
          id: edge.id || `e_${edge.from}_${edge.to}`,
          from: edge.from,
          to: edge.to,
          label: edge.label,
          isMain: edge.isMain,
          isImportant: edge.isImportant,
          width: isMainOrImportant ? 3 : 1.2,
          dashes: isMainOrImportant ? false : [5, 5],
          arrows: isMainOrImportant ? 'to' : '',
          color: { color: isMainOrImportant ? '#2eaadc' : '#999999', opacity: 1 },
          font: { size: 11, align: 'horizontal', background: '#ffffff', strokeWidth: 2, strokeColor: '#ffffff' },
          smooth: { type: 'cubicBezier', forceDirection: 'horizontal' }
        };
      });

      nodesDataSet.add(processedNodes);
      edgesDataSet.add(processedEdges);

      const container = document.getElementById('network');
      const data = { nodes: nodesDataSet, edges: edgesDataSet };
      
      const options = {
        layout: {
          hierarchical: { enabled: true, direction: 'LR', sortMethod: 'directed', nodeSpacing: 160, levelSeparation: 220 }
        },
        physics: { enabled: false },
        interaction: { hover: false }
      };

      network = new vis.Network(container, data, options);

      setTimeout(storeBasePositions, 200);

      applyModeRules();
      setupInteractiveRotation();
      saveHistoryState();

      network.on("click", function (params) {
        if (clickTimeout) clearTimeout(clickTimeout);

        clickTimeout = setTimeout(() => {
          if (params.nodes.length > 0) {
            handleSingleClick(params.nodes[0]);
          } else {
            const clickPos = params.pointer.canvas;
            const positions = network.getPositions();
            let nearestNodeId = null;
            let minDistance = Infinity;

            for (let id in positions) {
              const nodePos = positions[id];
              const dist = Math.hypot(clickPos.x - nodePos.x, clickPos.y - nodePos.y);
              if (dist < minDistance) {
                minDistance = dist;
                nearestNodeId = Number(id);
              }
            }

            if (minDistance < 70 && nearestNodeId) {
              handleSingleClick(nearestNodeId);
            } else {
              handleBackgroundClick();
            }
          }
        }, 220);
      });

      network.on("doubleClick", function (params) {
        if (clickTimeout) clearTimeout(clickTimeout);
        if (params.nodes.length > 0) {
          handleDoubleClick(params.nodes[0]);
        }
      });
    }

    function storeBasePositions() {
      const positions = network.getPositions();
      basePositions = {};
      let sumX = 0, sumY = 0, count = 0;
      for (let id in positions) {
        basePositions[id] = { x: positions[id].x, y: positions[id].y };
        sumX += positions[id].x;
        sumY += positions[id].y;
        count++;
      }
      if (count > 0) { centerPos = { x: sumX / count, y: sumY / count }; }
      network.setOptions({ layout: { hierarchical: { enabled: false } } });
    }

    function setupInteractiveRotation() {
      const container = document.getElementById('network');
      container.addEventListener('contextmenu', e => e.preventDefault());

      container.addEventListener('mousedown', (e) => {
        if (e.button === 2 || (e.button === 0 && e.shiftKey)) {
          isRotating = true;
          const rect = container.getBoundingClientRect();
          const mouseX = e.clientX - rect.left - rect.width / 2;
          const mouseY = e.clientY - rect.top - rect.height / 2;
          startAngle = Math.atan2(mouseY, mouseX) - currentRotation;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!isRotating || e.touches) return;
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left - rect.width / 2;
        const mouseY = e.clientY - rect.top - rect.height / 2;
        const angle = Math.atan2(mouseY, mouseX);
        currentRotation = angle - startAngle;
        applyRotation(currentRotation);
      });

      window.addEventListener('mouseup', () => { isRotating = false; });

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isRotating = true;
          const p1 = e.touches[0];
          const p2 = e.touches[1];
          startAngle = Math.atan2(p2.clientY - p1.clientY, p2.clientX - p1.clientX) - currentRotation;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (isRotating && e.touches.length === 2) {
          const p1 = e.touches[0];
          const p2 = e.touches[1];
          const angle = Math.atan2(p2.clientY - p1.clientY, p2.clientX - p1.clientX);
          currentRotation = angle - startAngle;
          applyRotation(currentRotation);
        }
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) { isRotating = false; }
      });
    }

    function applyRotation(angle) {
      if (!basePositions) return;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const updates = [];
      for (let id in basePositions) {
        const pos = basePositions[id];
        const dx = pos.x - centerPos.x;
        const dy = pos.y - centerPos.y;
        const newX = centerPos.x + (dx * cos - dy * sin);
        const newY = centerPos.y + (dx * sin + dy * cos);
        updates.push({ id: Number(id), x: newX, y: newY });
      }
      nodesDataSet.update(updates);
    }

    // --- TÍNH NĂNG NỔI BẬT 1: Ổ KHÓA SỬA GHI CHÚ ---
    function toggleNoteLock() {
      if (!selectedNodeData) return;
      isNoteEditable = !isNoteEditable;
      
      const contentDiv = document.getElementById('drawer-content');
      const btnLock = document.getElementById('btn-lock');

      if (isNoteEditable) {
        contentDiv.contentEditable = "true";
        contentDiv.focus();
        btnLock.innerHTML = "🔓 Đang sửa";
        btnLock.style.background = "#ff9800";
        btnLock.style.color = "#ffffff";
        btnLock.style.borderColor = "#f57c00";
      } else {
        contentDiv.contentEditable = "false";
        btnLock.innerHTML = "🔒 Chỉ đọc";
        btnLock.style.background = "";
        btnLock.style.color = "";
        btnLock.style.borderColor = "";

        // Tự động lưu nội dung mới chỉnh sửa vào bộ nhớ nút
        const updatedHTML = contentDiv.innerHTML;
        selectedNodeData.detail = updatedHTML;
        nodesDataSet.update({ id: selectedNodeData.id, detail: updatedHTML });
        saveHistoryState();
      }
    }

    // --- TÍNH NĂNG NỔI BẬT 2: TỰ ĐỘNG TẠO BẢN ĐỒ CON QUA Ô TÌM KIẾM ---
    function handleSearch(query) {
      query = query.trim();
      if (!query) {
        applyModeRules();
        return;
      }

      // 1. Cú pháp (B) -> Tạo bản đồ con xuất phát từ B về sau
      const subMapMatch = query.match(/^\((.+)\)$/);
      if (subMapMatch) {
        const nodeName = subMapMatch[1].trim().toLowerCase();
        const targetNode = nodesDataSet.get().find(n => n.originalLabel.toLowerCase().includes(nodeName));
        if (targetNode) {
          createSubMapForNode(targetNode.id);
        }
        return;
      }

      // 2. Cú pháp A-->B -> Tạo bản đồ con nối giữa A và B
      const pathMatch = query.match(/^(.+)\-\->(.+)$/);
      if (pathMatch) {
        const startName = pathMatch[1].trim().toLowerCase();
        const endName = pathMatch[2].trim().toLowerCase();
        const startNode = nodesDataSet.get().find(n => n.originalLabel.toLowerCase().includes(startName));
        const endNode = nodesDataSet.get().find(n => n.originalLabel.toLowerCase().includes(endName));

        if (startNode && endNode) {
          createSubMapForPath(startNode.id, endNode.id);
        }
        return;
      }

      // 3. Tìm kiếm thường (Highlight)
      const matchedNode = nodesDataSet.get().find(n => n.originalLabel.toLowerCase().includes(query.toLowerCase()));
      if (matchedNode) {
        network.focus(matchedNode.id, { scale: 1.15, animation: { duration: 400 } });
        handleSingleClick(matchedNode.id);
      }
    }

    // HÀM TẠO BẢN ĐỒ CON CHO (B)
    function createSubMapForNode(rootId) {
      const subNodes = new Set([rootId]);
      const subEdges = new Set();

      function traverse(currentId) {
        const outEdges = edgesDataSet.get({ filter: e => e.from === currentId });
        outEdges.forEach(e => {
          subEdges.add(e.id);
          if (!subNodes.has(e.to)) {
            subNodes.add(e.to);
            traverse(e.to);
          }
        });
      }
      traverse(rootId);

      nodesDataSet.update(nodesDataSet.get().map(n => ({
        id: n.id,
        hidden: !subNodes.has(n.id),
        opacity: 1.0
      })));

      edgesDataSet.update(edgesDataSet.get().map(e => ({
        id: e.id,
        hidden: !subEdges.has(e.id),
        color: { color: e.isMain ? '#2eaadc' : '#e74c3c', opacity: 1.0 }
      })));

      setTimeout(() => network.fit({ animation: { duration: 400 } }), 100);
    }

    // HÀM TẠO BẢN ĐỒ CON CHO A-->B
    function createSubMapForPath(startId, endId) {
      const pathNodes = new Set();
      const pathEdges = new Set();

      function findPaths(currentId, visitedNodes, visitedEdges) {
        if (currentId === endId) {
          visitedNodes.forEach(n => pathNodes.add(n));
          visitedEdges.forEach(e => pathEdges.add(e));
          return;
        }

        const outEdges = edgesDataSet.get({ filter: e => e.from === currentId });
        outEdges.forEach(e => {
          if (!visitedNodes.includes(e.to)) {
            findPaths(e.to, [...visitedNodes, e.to], [...visitedEdges, e.id]);
          }
        });
      }

      findPaths(startId, [startId], []);

      if (pathNodes.size === 0) {
        pathNodes.add(startId);
        pathNodes.add(endId);
      }

      nodesDataSet.update(nodesDataSet.get().map(n => ({
        id: n.id,
        hidden: !pathNodes.has(n.id),
        opacity: 1.0
      })));

      edgesDataSet.update(edgesDataSet.get().map(e => ({
        id: e.id,
        hidden: !pathEdges.has(e.id),
        color: { color: e.isMain ? '#2eaadc' : '#e74c3c', opacity: 1.0 }
      })));

      setTimeout(() => network.fit({ animation: { duration: 400 } }), 100);
    }

    // --- QUẢN LÝ LỊCH SỬ THAO TÁC (UNDO / REDO) ---
    function saveHistoryState() {
      if (isNavigatingHistory) return;

      const state = {
        mode: currentMode,
        selectedNodeId: selectedNodeData ? selectedNodeData.id : null,
        activePathNodes: Array.from(activePathNodeIds),
        activePathEdges: Array.from(activePathEdgeIds),
        activeSecondaryNodeId: activeSecondaryNodeId,
        drawerOpen: document.getElementById('drawer').classList.contains('open')
      };

      if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
      }

      historyStack.push(state);
      historyIndex = historyStack.length - 1;
      updateHistoryButtonsUI();
    }

    function restoreState(state) {
      isNavigatingHistory = true;

      if (currentMode !== state.mode) {
        currentMode = state.mode;
        updateModeUI();
      }

      activePathNodeIds = new Set(state.activePathNodes);
      activePathEdgeIds = new Set(state.activePathEdges);
      activeSecondaryNodeId = state.activeSecondaryNodeId;

      if (state.selectedNodeId) {
        selectedNodeData = nodesDataSet.get(state.selectedNodeId);
        const btnNote = document.getElementById('btn-note');
        btnNote.classList.add('ready');
        btnNote.innerText = `📝 Ghi chú: ${selectedNodeData.originalLabel}`;
      } else {
        deselectNodeUI();
      }

      if (currentMode === 1) {
        if (activePathNodeIds.size > 0) {
          renderMode1Path();
        } else {
          hideAllEdges();
          resetNodesOpacity();
        }
      } else if (currentMode === 2) {
        if (activeSecondaryNodeId) {
          showMainAndSpecificSecondaryEdges(activeSecondaryNodeId);
        } else {
          showOnlyMainEdges();
        }
        if (state.selectedNodeId) {
          highlightPath(state.selectedNodeId);
        } else {
          resetNodesOpacity();
        }
      }

      if (state.drawerOpen && selectedNodeData) {
        openDrawer(selectedNodeData.detail);
      } else {
        closeDrawer();
      }

      isNavigatingHistory = false;
      updateHistoryButtonsUI();
    }

    function undoState() {
      if (historyIndex > 0) {
        historyIndex--;
        restoreState(historyStack[historyIndex]);
      }
    }

    function redoState() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        restoreState(historyStack[historyIndex]);
      }
    }

    function updateHistoryButtonsUI() {
      document.getElementById('btn-undo').disabled = (historyIndex <= 0);
      document.getElementById('btn-redo').disabled = (historyIndex >= historyStack.length - 1);
    }

    function applyModeRules() {
      activeSecondaryNodeId = null;
      activePathNodeIds.clear();
      activePathEdgeIds.clear();
      deselectNodeUI();
      resetNodesOpacity();

      if (currentMode === 1) {
        hideAllEdges();
      } else if (currentMode === 2) {
        showOnlyMainEdges();
      }
    }

    function updateModeUI() {
      const btn = document.getElementById('btn-mode');
      const guide = document.getElementById('guide-text');

      if (currentMode === 1) {
        btn.innerText = "📍 Dạng 1: Bản đồ";
        btn.classList.remove('active');
        guide.innerText = "Click 1: Nối lũy tiến luồng | Click đúp: Xóa luồng";
      } else {
        btn.innerText = "🌐 Dạng 2: Hệ thống";
        btn.classList.add('active');
        guide.innerText = "Mặc định: Chỉ hiện đường chính | Click đúp: Mở đường phụ";
      }
    }

    function cycleMode() {
      currentMode = (currentMode === 2) ? 1 : 2;
      updateModeUI();
      closeDrawer();
      applyModeRules();
      saveHistoryState();
    }

    function handleSingleClick(nodeId) {
      selectedNodeData = nodesDataSet.get(nodeId);

      const btnNote = document.getElementById('btn-note');
      btnNote.classList.add('ready');
      btnNote.innerText = `📝 Ghi chú: ${selectedNodeData.originalLabel}`;

      if (currentMode === 1) {
        activePathNodeIds.add(nodeId);
        network.getConnectedNodes(nodeId).forEach(id => activePathNodeIds.add(id));
        network.getConnectedEdges(nodeId).forEach(id => activePathEdgeIds.add(id));
        renderMode1Path();
      } else if (currentMode === 2) {
        highlightPath(nodeId);
      }

      saveHistoryState();
    }

    function renderMode1Path() {
      const edgeUpdates = edgesDataSet.get().map(e => ({
        id: e.id,
        hidden: !activePathEdgeIds.has(e.id),
        color: { color: e.isMain ? '#2eaadc' : '#e74c3c', opacity: 1.0 }
      }));
      edgesDataSet.update(edgeUpdates);

      const nodeUpdates = nodesDataSet.get().map(n => ({
        id: n.id,
        opacity: activePathNodeIds.has(n.id) ? 1.0 : 0.25
      }));
      nodesDataSet.update(nodeUpdates);
    }

    function toggleDrawerForSelected() {
      if (!selectedNodeData) return;
      const drawer = document.getElementById('drawer');
      if (drawer.classList.contains('open')) {
        closeDrawer();
      } else {
        openDrawer(selectedNodeData.detail);
      }
      saveHistoryState();
    }

    function deselectNodeUI() {
      selectedNodeData = null;
      const btnNote = document.getElementById('btn-note');
      btnNote.classList.remove('ready');
      btnNote.innerText = "📝 Xem Ghi Chú";
    }

    function handleDoubleClick(nodeId) {
      if (currentMode === 1) {
        activePathNodeIds.clear();
        activePathEdgeIds.clear();
        hideAllEdges();
        resetNodesOpacity();
        deselectNodeUI();
        closeDrawer();
      } else if (currentMode === 2) {
        if (activeSecondaryNodeId === nodeId) {
          activeSecondaryNodeId = null;
          showOnlyMainEdges();
        } else {
          activeSecondaryNodeId = nodeId;
          showMainAndSpecificSecondaryEdges(nodeId);
        }
      }
      saveHistoryState();
    }

    function handleBackgroundClick() {
      closeDrawer();
      deselectNodeUI();
      applyModeRules();
      saveHistoryState();
    }

    function hideAllEdges() {
      const updates = edgesDataSet.get().map(e => ({ id: e.id, hidden: true }));
      edgesDataSet.update(updates);
    }

    function showOnlyMainEdges() {
      const updates = edgesDataSet.get().map(e => {
        const isMainOrImportant = e.isMain || e.isImportant;
        return { id: e.id, hidden: !isMainOrImportant, color: { color: '#2eaadc', opacity: 1 } };
      });
      edgesDataSet.update(updates);
    }

    function showMainAndSpecificSecondaryEdges(targetNodeId) {
      const updates = edgesDataSet.get().map(e => {
        const isMainOrImportant = e.isMain || e.isImportant;
        const isConnectedToTarget = (e.from === targetNodeId || e.to === targetNodeId);
        if (isMainOrImportant) {
          return { id: e.id, hidden: false, color: { color: '#2eaadc', opacity: 1 } };
        } else if (isConnectedToTarget) {
          return { id: e.id, hidden: false, color: { color: '#e74c3c', opacity: 1 } };
        } else {
          return { id: e.id, hidden: true };
        }
      });
      edgesDataSet.update(updates);
    }

    function highlightPath(selectedNodeId) {
      const connectedNodes = network.getConnectedNodes(selectedNodeId);
      connectedNodes.push(selectedNodeId);
      const updates = nodesDataSet.get().map(node => ({
        id: node.id,
        opacity: connectedNodes.includes(node.id) ? 1 : 0.25
      }));
      nodesDataSet.update(updates);
    }

    function resetNodesOpacity() {
      const updates = nodesDataSet.get().map(node => ({ id: node.id, opacity: 1 }));
      nodesDataSet.update(updates);
    }

    function toggleActiveRecall() {
      isActiveRecall = !isActiveRecall;
      document.getElementById('btn-recall').classList.toggle('active', isActiveRecall);
      const updates = nodesDataSet.get().map(node => ({
        id: node.id,
        label: isActiveRecall ? '❓ [Khái niệm]' : node.originalLabel
      }));
      nodesDataSet.update(updates);
    }

    function openDrawer(content) {
      document.getElementById('drawer-content').innerHTML = content || 'Không có chi tiết.';
      document.getElementById('drawer').classList.add('open');
    }
    
    function closeDrawer() {
      // Đóng khóa sửa nếu đang mở trước khi đóng drawer
      if (isNoteEditable) toggleNoteLock();
      document.getElementById('drawer').classList.remove('open');
    }

    function resetView() { 
      document.getElementById('search-input').value = "";
      currentRotation = 0; 
      applyRotation(0); 
      network.fit({ animation: { duration: 300 } }); 
      applyModeRules(); 
      closeDrawer(); 
      saveHistoryState();
    }
    
    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

    window.onload = initNetwork;
  </script>
</body>
</html>
