<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Flowchart Engine</title>
  <!-- Vis.js Network CDN -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #2f3437;
      --card-bg: #f7f6f3;
      --border-color: #e9e9e7;
      --accent-color: #2eaadc;
      --drawer-width: 350px;
    }

    body.dark-mode {
      --bg-color: #191919;
      --text-color: #d4d4d4;
      --card-bg: #202020;
      --border-color: #2f2f2f;
      --accent-color: #529cca;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }

    /* Control Toolbar Header */
    #toolbar {
      height: 50px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 10px;
      z-index: 10;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }
    .btn.active { background: var(--accent-color); color: white; }

    #search-input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 13px;
      outline: none;
      width: 160px;
    }

    /* Main Container (Ép chiều cao tối thiểu để không bị trắng) */
    #main-container {
      width: 100%;
      height: calc(100vh - 50px);
      min-height: 550px;
      position: relative;
      display: flex;
    }
    #network {
      width: 100%;
      height: 100%;
      min-height: 550px;
      background-color: var(--bg-color);
    }

    /* Slide-out Drawer Modal */
    #drawer {
      position: absolute;
      top: 0; right: 0;
      width: var(--drawer-width);
      height: 100%;
      background: var(--card-bg);
      border-left: 1px solid var(--border-color);
      box-shadow: -4px 0 15px rgba(0,0,0,0.05);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 20;
      padding: 20px;
      overflow-y: auto;
    }
    #drawer.open { transform: translateX(0); }
    #drawer-close {
      position: absolute; top: 15px; right: 15px;
      background: none; border: none; font-size: 18px;
      cursor: pointer; color: var(--text-color);
    }
    #drawer-content { margin-top: 20px; line-height: 1.6; font-size: 14px; }
  </style>
</head>
<body>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <input type="text" id="search-input" placeholder="🔍 Tìm kiếm..." oninput="handleSearch(this.value)">
    <button class="btn" id="btn-recall" onclick="toggleActiveRecall()">❓ Active Recall</button>
    <button class="btn" onclick="resetView()">🔄 Reset Góc Nhìn</button>
    <button class="btn" onclick="toggleDarkMode()">🌙 / ☀️</button>
  </div>

  <!-- CANVAS AREA -->
  <div id="main-container">
    <div id="network"></div>

    <!-- Slide-out Drawer -->
    <div id="drawer">
      <button id="drawer-close" onclick="closeDrawer()">✕</button>
      <div id="drawer-content">Chưa chọn nút nào.</div>
    </div>
  </div>

  <script>
    // 1. DATA PAYLOAD
    const rawData = {
      "nodes": [
        { "id": 1, "label": "Vi khuẩn Gram-", "group": "target", "tooltip": "💡 Analogy: Thành trì 2 lớp giáp bảo vệ.", "detail": "<h3>📌 Vi khuẩn Gram-âm</h3><p>Có cấu trúc vách kép gồm <b>Màng ngoài</b> và <b>Peptidoglycan mỏng</b>.</p>" },
        { "id": 2, "label": "Kênh Porin", "group": "structure", "tooltip": "💡 Cửa ngõ duy nhất qua màng ngoài.", "detail": "<h3>🚪 Kênh Porin</h3><p>Đường dẫn duy nhất để kháng sinh thân nước đi qua màng ngoài.</p>" },
        { "id": 3, "label": "Vách Peptidoglycan", "group": "structure", "tooltip": "💡 Khung xương chịu lực.", "detail": "<h3>🧱 Vách Peptidoglycan</h3><p>Được tổng hợp nhờ enzyme <b>Transpeptidase (PBP)</b>.</p>" },
        { "id": 4, "label": "KS Beta-lactam", "group": "drug", "tooltip": "💡 Vũ khí chứa vòng 4 cạnh.", "detail": "<h3>💊 Kháng sinh Beta-lactam</h3><p>Bao gồm Penicillin, Cephalosporin, Carbapenem.</p>" },
        { "id": 5, "label": "Enzyme PBP", "group": "mechanism", "tooltip": "💡 Đích tác dụng chính.", "detail": "<h3>🛠️ PBP (Transpeptidase)</h3><p>Khi Beta-lactam gắn vào PBP -> Vách không thể hình thành -> Vi khuẩn vỡ.</p>" },
        { "id": 6, "label": "Enzyme Beta-lactamase", "group": "resistance", "tooltip": "💡 Kéo cắt phá hủy thuốc.", "detail": "<h3>✂️ Beta-lactamase</h3><p>Enzyme do vi khuẩn tiết ra để thủy phân vòng Beta-lactam.</p>" }
      ],
      "edges": [
        { "from": 1, "to": 2, "label": "Chứa" },
        { "from": 1, "to": 3, "label": "Bao bọc" },
        { "from": 4, "to": 2, "label": "Thấm qua", "dashes": true },
        { "from": 4, "to": 5, "label": "Gắn & Ức chế" },
        { "from": 5, "to": 3, "label": "Xây dựng", "dashes": true },
        { "from": 6, "to": 4, "label": "Thủy phân", "color": { "color": "#e74c3c" } }
      ]
    };

    // 2. ENGINE LOGIC
    let network = null;
    let nodesDataSet = new vis.DataSet();
    let edgesDataSet = new vis.DataSet();
    let isActiveRecall = false;

    const groupColors = {
      target: { background: '#e3f2fd', border: '#2196f3' },
      structure: { background: '#f3e5f5', border: '#ab47bc' },
      drug: { background: '#e8f5e9', border: '#66bb6a' },
      mechanism: { background: '#fffde7', border: '#ffee58' },
      resistance: { background: '#ffebee', border: '#ef5350' }
    };

    function initNetwork() {
      const processedNodes = rawData.nodes.map(node => ({
        id: node.id,
        label: node.label,
        originalLabel: node.label,
        title: node.tooltip,
        detail: node.detail,
        group: node.group,
        color: groupColors[node.group] || { background: '#ffffff', border: '#cccccc' },
        font: { size: 14, color: '#2f3437' },
        shape: 'box',
        margin: 10,
        borderWidth: 2
      }));

      const processedEdges = rawData.edges.map(edge => ({
        ...edge,
        arrows: 'to',
        font: { size: 11, align: 'middle' },
        smooth: { type: 'cubicBezier' }
      }));

      nodesDataSet.add(processedNodes);
      edgesDataSet.add(processedEdges);

      const container = document.getElementById('network');
      const data = { nodes: nodesDataSet, edges: edgesDataSet };
      
      const options = {
        physics: {
          stabilization: { iterations: 100 },
          barnesHut: { gravitationalConstant: -2000, springLength: 100 }
        },
        interaction: { hover: true }
      };

      network = new vis.Network(container, data, options);

      // Đóng băng vật lý sau khi dàn trang xong
      network.once('stabilizationIterationsDone', function () {
        network.setOptions({ physics: false });
      });

      // Sự kiện click
      network.on("click", function (params) {
        if (params.nodes.length > 0) {
          const nodeId = params.nodes[0];
          const nodeData = nodesDataSet.get(nodeId);
          openDrawer(nodeData.detail);
          highlightPath(nodeId);
        } else {
          closeDrawer();
          resetHighlight();
        }
      });
    }

    function toggleActiveRecall() {
      isActiveRecall = !isActiveRecall;
      document.getElementById('btn-recall').classList.toggle('active', isActiveRecall);
      
      const updates = nodesDataSet.get().map(node => ({
        id: node.id,
        label: isActiveRecall ? '❓ [Khái niệm]' : node.originalLabel
      }));
      nodesDataSet.update(updates);
    }

    function openDrawer(content) {
      document.getElementById('drawer-content').innerHTML = content || 'Không có chi tiết.';
      document.getElementById('drawer').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    function highlightPath(selectedNodeId) {
      const connectedNodes = network.getConnectedNodes(selectedNodeId);
      connectedNodes.push(selectedNodeId);

      const updates = nodesDataSet.get().map(node => ({
        id: node.id,
        opacity: connectedNodes.includes(node.id) ? 1 : 0.25
      }));
      nodesDataSet.update(updates);
    }

    function resetHighlight() {
      const updates = nodesDataSet.get().map(node => ({ id: node.id, opacity: 1 }));
      nodesDataSet.update(updates);
    }

    function handleSearch(query) {
      if (!query.trim()) { resetHighlight(); return; }
      const matchedNode = nodesDataSet.get().find(n => 
        n.originalLabel.toLowerCase().includes(query.toLowerCase())
      );
      if (matchedNode) {
        network.focus(matchedNode.id, { scale: 1.2, animation: { duration: 400 } });
        highlightPath(matchedNode.id);
      }
    }

    function resetView() {
      network.fit({ animation: { duration: 400 } });
      resetHighlight();
      closeDrawer();
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    window.onload = initNetwork;
  </script>
</body>
</html>
