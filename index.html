<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iCanStudy Advanced Interactive Engine</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #2f3437;
      --card-bg: #f7f6f3;
      --border-color: #e9e9e7;
      --accent-color: #2eaadc;
      --drawer-width: 360px;
    }
    body.dark-mode {
      --bg-color: #191919;
      --text-color: #d4d4d4;
      --card-bg: #202020;
      --border-color: #2f2f2f;
      --accent-color: #529cca;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; touch-action: none; }

    /* TOOLBAR */
    #toolbar {
      height: 50px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      z-index: 10;
    }
    .btn {
      padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }
    .btn.active { background: var(--accent-color); color: white; }
    
    /* NÚT GHI CHÚ SMARTER */
    .btn-note {
      opacity: 0.4;
      pointer-events: none;
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--border-color);
    }
    .btn-note.ready {
      opacity: 1;
      pointer-events: auto;
      background: #ff9800 !important;
      color: white !important;
      border-color: #f57c00 !important;
      animation: pulse-glow 1.5s infinite;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.4); }
      70% { box-shadow: 0 0 0 7px rgba(255, 152, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
    }

    #search-input {
      padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); font-size: 12px; outline: none; width: 110px;
    }

    #main-container { width: 100%; height: calc(100vh - 50px); min-height: 550px; position: relative; display: flex; }
    #network { width: 100%; height: 100%; min-height: 550px; background-color: var(--bg-color); cursor: grab; }
    #network:active { cursor: grabbing; }

    /* DRAWER */
    #drawer {
      position: absolute; top: 0; right: 0; width: var(--drawer-width); height: 100%;
      background: var(--card-bg); border-left: 1px solid var(--border-color);
      box-shadow: -4px 0 15px rgba(0,0,0,0.08); transform: translateX(100%);
      transition: transform 0.3s ease; z-index: 20; padding: 20px; overflow-y: auto;
    }
    #drawer.open { transform: translateX(0); }
    #drawer-close { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-color); }
    #drawer-content { margin-top: 20px; line-height: 1.6; font-size: 14px; }
    
    .status-guide {
      font-size: 11px; color: #777; margin-left: auto; font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <button class="btn active" id="btn-mode" onclick="cycleMode()">🌐 Dạng 2: Hệ thống</button>
    <button class="btn btn-note" id="btn-note" onclick="toggleDrawerForSelected()">📝 Xem Ghi Chú</button>
    <button class="btn" id="btn-recall" onclick="toggleActiveRecall()">❓ Active Recall</button>
    <input type="text" id="search-input" placeholder="🔍 Tìm nút..." oninput="handleSearch(this.value)">
    <button class="btn" onclick="resetView()">🔄 Reset</button>
    <button class="btn" onclick="toggleDarkMode()">🌙/☀️</button>
    <span class="status-guide" id="guide-text">💻 Chuột phải / 📱 2 Ngón tay để xoay 360°</span>
  </div>

  <div id="main-container">
    <div id="network"></div>
    <div id="drawer">
      <button id="drawer-close" onclick="closeDrawer()">✕</button>
      <div id="drawer-content">Chưa chọn nút nào.</div>
    </div>
  </div>

  <script>
    let network = null;
    let nodesDataSet = new vis.DataSet();
    let edgesDataSet = new vis.DataSet();
    
    // TRẠNG THÁI HỆ THỐNG
    let currentMode = 2; 
    let isActiveRecall = false;
    let lockedNodeId = null;
    let selectedNodeData = null;
    let activeSecondaryNodeId = null;
    let clickTimeout = null;

    // QUẢN LÝ XOAY 360° BẰNG CHUỘT & ĐIỆN THOẠI (TOUCH)
    let basePositions = null;
    let centerPos = { x: 0, y: 0 };
    let isRotating = false;
    let startAngle = 0;
    let currentRotation = 0;

    const rawData = {
      "nodes": [
        { "id": 1, "label": "Vi khuẩn Gram-âm", "level": 1, "group": "target", "tooltip": "💡 Nút chính Bậc 1", "detail": "<h3>📌 Vi khuẩn Gram-âm</h3><p>Có vách tế bào kép đặc trưng gồm màng ngoài và peptidoglycan.</p>" },
        { "id": 2, "label": "Kênh Porin", "level": 2, "group": "structure", "tooltip": "💡 Cửa ngõ qua màng", "detail": "<h3>🚪 Kênh Porin</h3><p>Kênh vận chuyển chất thân nước đi qua màng ngoài.</p>" },
        { "id": 3, "label": "Vách Peptidoglycan", "level": 2, "group": "structure", "tooltip": "💡 Bổ trợ vách", "detail": "<h3>🧱 Vách Peptidoglycan</h3><p>Đích tác dụng của nhiều kháng sinh diệt khuẩn.</p>" },
        { "id": 4, "label": "KS Beta-lactam", "level": 1, "group": "drug", "tooltip": "💡 Nút chính Bậc 1", "detail": "<h3>💊 Kháng sinh Beta-lactam</h3><p>Nhóm kháng sinh diệt khuẩn mạnh bằng cách ức chế vách.</p>" },
        { "id": 5, "label": "Ức chế Enzyme PBP", "level": 2, "group": "mechanism", "tooltip": "💡 Cơ chế tác dụng", "detail": "<h3>🛠️ Enzyme PBP</h3><p>PBP bị gắn chặt làm ngưng tổng hợp peptidoglycan.</p>" },
        { "id": 6, "label": "Tiết Beta-lactamase", "level": 2, "group": "resistance", "tooltip": "💡 Cơ chế đề kháng", "detail": "<h3>✂️ Beta-lactamase</h3><p>Thủy phân vòng beta-lactam khiến kháng sinh mất tác dụng.</p>" }
      ],
      "edges": [
        { "id": "e1-2", "from": 1, "to": 2, "label": "Chứa", "isMain": true },
        { "id": "e1-3", "from": 1, "to": 3, "label": "Bao bọc", "isMain": true },
        { "id": "e4-5", "from": 4, "to": 5, "label": "Cơ chế chính", "isMain": true },
        { "id": "e5-3", "from": 5, "to": 3, "label": "Phá hủy vách", "isMain": true },
        { "id": "e4-2", "from": 4, "to": 2, "label": "Thấm qua", "isMain": false },
        { "id": "e6-4", "from": 6, "to": 4, "label": "Đề kháng mạnh", "isMain": false, "isImportant": true }
      ]
    };

    const groupColors = {
      target: { background: '#1976d2', border: '#0d47a1', fontColor: '#ffffff' },
      drug: { background: '#2e7d32', border: '#1b5e20', fontColor: '#ffffff' },
      structure: { background: '#f3e5f5', border: '#ab47bc', fontColor: '#2f3437' },
      mechanism: { background: '#fff9c4', border: '#fbc02d', fontColor: '#2f3437' },
      resistance: { background: '#ffebee', border: '#ef5350', fontColor: '#2f3437' }
    };

    function initNetwork() {
      const processedNodes = rawData.nodes.map(node => {
        const isLevel1 = node.level === 1;
        const colorConfig = groupColors[node.group] || { background: '#ffffff', border: '#cccccc', fontColor: '#2f3437' };
        return {
          id: node.id,
          label: node.label,
          originalLabel: node.label,
          title: node.tooltip,
          detail: node.detail,
          level: node.level,
          group: node.group,
          color: { background: colorConfig.background, border: colorConfig.border },
          font: { size: isLevel1 ? 15 : 12.5, color: colorConfig.fontColor, bold: isLevel1 },
          shape: 'box',
          margin: isLevel1 ? 12 : 8,
          borderWidth: isLevel1 ? 2.5 : 1.5
        };
      });

      const processedEdges = rawData.edges.map(edge => {
        const isMainOrImportant = edge.isMain || edge.isImportant;
        return {
          id: edge.id,
          from: edge.from,
          to: edge.to,
          label: edge.label,
          isMain: edge.isMain,
          isImportant: edge.isImportant,
          width: isMainOrImportant ? 3 : 1.2,
          dashes: isMainOrImportant ? false : [5, 5],
          arrows: isMainOrImportant ? 'to' : '',
          color: { color: isMainOrImportant ? '#2eaadc' : '#999999', opacity: 1 },
          font: { 
            size: 11, 
            align: 'horizontal', 
            background: '#ffffff',
            strokeWidth: 2,
            strokeColor: '#ffffff'
          },
          smooth: { type: 'cubicBezier', forceDirection: 'horizontal' }
        };
      });

      nodesDataSet.add(processedNodes);
      edgesDataSet.add(processedEdges);

      const container = document.getElementById('network');
      const data = { nodes: nodesDataSet, edges: edgesDataSet };
      
      const options = {
        layout: {
          hierarchical: { enabled: true, direction: 'LR', sortMethod: 'directed', nodeSpacing: 160, levelSeparation: 220 }
        },
        physics: { enabled: false },
        interaction: { hover: false }
      };

      network = new vis.Network(container, data, options);

      setTimeout(storeBasePositions, 200);

      applyModeRules();
      setupInteractiveRotation();

      network.on("click", function (params) {
        if (clickTimeout) clearTimeout(clickTimeout);
        clickTimeout = setTimeout(() => {
          if (params.nodes.length > 0) {
            handleSingleClick(params.nodes[0]);
          } else {
            handleBackgroundClick();
          }
        }, 220);
      });

      network.on("doubleClick", function (params) {
        if (clickTimeout) clearTimeout(clickTimeout);
        if (params.nodes.length > 0) {
          handleDoubleClick(params.nodes[0]);
        }
      });
    }

    function storeBasePositions() {
      const positions = network.getPositions();
      basePositions = {};
      let sumX = 0, sumY = 0, count = 0;
      for (let id in positions) {
        basePositions[id] = { x: positions[id].x, y: positions[id].y };
        sumX += positions[id].x;
        sumY += positions[id].y;
        count++;
      }
      if (count > 0) {
        centerPos = { x: sumX / count, y: sumY / count };
      }
      network.setOptions({ layout: { hierarchical: { enabled: false } } });
    }

    // LẬP TRÌNH XOAY ĐA NỀN TẢNG (MÁY TÍNH & ĐIỆN THOẠI CẢM ỨNG)
    function setupInteractiveRotation() {
      const container = document.getElementById('network');
      container.addEventListener('contextmenu', e => e.preventDefault());

      // 1. DÀNH CHO MÁY TÍNH (CHUỘT PHẢI / SHIFT)
      container.addEventListener('mousedown', (e) => {
        if (e.button === 2 || (e.button === 0 && e.shiftKey)) {
          isRotating = true;
          const rect = container.getBoundingClientRect();
          const mouseX = e.clientX - rect.left - rect.width / 2;
          const mouseY = e.clientY - rect.top - rect.height / 2;
          startAngle = Math.atan2(mouseY, mouseX) - currentRotation;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!isRotating || e.touches) return;
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left - rect.width / 2;
        const mouseY = e.clientY - rect.top - rect.height / 2;
        const angle = Math.atan2(mouseY, mouseX);
        currentRotation = angle - startAngle;
        applyRotation(currentRotation);
      });

      window.addEventListener('mouseup', () => { isRotating = false; });

      // 2. DÀNH CHO ĐIỆN THOẠI / TABLET (CỬ CHỈ 2 NGÓN TAY XOAY)
      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isRotating = true;
          const p1 = e.touches[0];
          const p2 = e.touches[1];
          startAngle = Math.atan2(p2.clientY - p1.clientY, p2.clientX - p1.clientX) - currentRotation;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (isRotating && e.touches.length === 2) {
          const p1 = e.touches[0];
          const p2 = e.touches[1];
          const angle = Math.atan2(p2.clientY - p1.clientY, p2.clientX - p1.clientX);
          currentRotation = angle - startAngle;
          applyRotation(currentRotation);
        }
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          isRotating = false;
        }
      });
    }

    function applyRotation(angle) {
      if (!basePositions) return;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      
      const updates = [];
      for (let id in basePositions) {
        const pos = basePositions[id];
        const dx = pos.x - centerPos.x;
        const dy = pos.y - centerPos.y;
        
        const newX = centerPos.x + (dx * cos - dy * sin);
        const newY = centerPos.y + (dx * sin + dy * cos);
        
        updates.push({ id: Number(id), x: newX, y: newY });
      }
      nodesDataSet.update(updates);
    }

    function applyModeRules() {
      lockedNodeId = null;
      activeSecondaryNodeId = null;
      deselectNodeUI();
      resetNodesOpacity();

      if (currentMode === 1) {
        hideAllEdges();
      } else if (currentMode === 2) {
        showOnlyMainEdges();
      }
    }

    function cycleMode() {
      currentMode = (currentMode === 2) ? 1 : 2;
      const btn = document.getElementById('btn-mode');
      const guide = document.getElementById('guide-text');

      if (currentMode === 1) {
        btn.innerText = "📍 Dạng 1: Bản đồ";
        btn.classList.remove('active');
        guide.innerText = "Click 1: Hiện rõ đường đi | Click đúp: Hủy đường đi";
      } else {
        btn.innerText = "🌐 Dạng 2: Hệ thống";
        btn.classList.add('active');
        guide.innerText = "Mặc định: Chỉ hiện đường chính | Click đúp: Mở đường phụ";
      }
      closeDrawer();
      applyModeRules();
    }

    function handleSingleClick(nodeId) {
      selectedNodeData = nodesDataSet.get(nodeId);

      const btnNote = document.getElementById('btn-note');
      btnNote.classList.add('ready');
      btnNote.innerText = `📝 Ghi chú: ${selectedNodeData.originalLabel}`;

      if (currentMode === 1) {
        lockedNodeId = nodeId;
        showConnectionsForNode(nodeId, 1.0, true);
      } else if (currentMode === 2) {
        highlightPath(nodeId);
      }
    }

    function toggleDrawerForSelected() {
      if (!selectedNodeData) return;
      const drawer = document.getElementById('drawer');
      if (drawer.classList.contains('open')) {
        closeDrawer();
      } else {
        openDrawer(selectedNodeData.detail);
      }
    }

    function deselectNodeUI() {
      selectedNodeData = null;
      const btnNote = document.getElementById('btn-note');
      btnNote.classList.remove('ready');
      btnNote.innerText = "📝 Xem Ghi Chú";
    }

    function handleDoubleClick(nodeId) {
      if (currentMode === 1) {
        lockedNodeId = null;
        hideAllEdges();
        resetNodesOpacity();
        deselectNodeUI();
        closeDrawer();
      } else if (currentMode === 2) {
        if (activeSecondaryNodeId === nodeId) {
          activeSecondaryNodeId = null;
          showOnlyMainEdges();
        } else {
          activeSecondaryNodeId = nodeId;
          showMainAndSpecificSecondaryEdges(nodeId);
        }
      }
    }

    function handleBackgroundClick() {
      closeDrawer();
      deselectNodeUI();
      applyModeRules();
    }

    function hideAllEdges() {
      const updates = edgesDataSet.get().map(e => ({ id: e.id, hidden: true }));
      edgesDataSet.update(updates);
    }

    function showOnlyMainEdges() {
      const updates = edgesDataSet.get().map(e => {
        const isMainOrImportant = e.isMain || e.isImportant;
        return {
          id: e.id,
          hidden: !isMainOrImportant,
          color: { color: '#2eaadc', opacity: 1 }
        };
      });
      edgesDataSet.update(updates);
    }

    function showMainAndSpecificSecondaryEdges(targetNodeId) {
      const updates = edgesDataSet.get().map(e => {
        const isMainOrImportant = e.isMain || e.isImportant;
        const isConnectedToTarget = (e.from === targetNodeId || e.to === targetNodeId);
        
        if (isMainOrImportant) {
          return { id: e.id, hidden: false, color: { color: '#2eaadc', opacity: 1 } };
        } else if (isConnectedToTarget) {
          return { id: e.id, hidden: false, color: { color: '#e74c3c', opacity: 1 } };
        } else {
          return { id: e.id, hidden: true };
        }
      });
      edgesDataSet.update(updates);
    }

    function showConnectionsForNode(nodeId, opacityLevel, dimOthers) {
      const connectedEdges = network.getConnectedEdges(nodeId);
      const connectedNodes = network.getConnectedNodes(nodeId);
      connectedNodes.push(nodeId);

      const edgeUpdates = edgesDataSet.get().map(e => {
        if (connectedEdges.includes(e.id)) {
          return { id: e.id, hidden: false, color: { color: e.isMain ? '#2eaadc' : '#e74c3c', opacity: opacityLevel } };
        } else {
          return { id: e.id, hidden: true };
        }
      });
      edgesDataSet.update(edgeUpdates);

      if (dimOthers) {
        const nodeUpdates = nodesDataSet.get().map(n => ({
          id: n.id,
          opacity: connectedNodes.includes(n.id) ? 1.0 : 0.25
        }));
        nodesDataSet.update(nodeUpdates);
      }
    }

    function highlightPath(selectedNodeId) {
      const connectedNodes = network.getConnectedNodes(selectedNodeId);
      connectedNodes.push(selectedNodeId);
      const updates = nodesDataSet.get().map(node => ({
        id: node.id,
        opacity: connectedNodes.includes(node.id) ? 1 : 0.25
      }));
      nodesDataSet.update(updates);
    }

    function resetNodesOpacity() {
      const updates = nodesDataSet.get().map(node => ({ id: node.id, opacity: 1 }));
      nodesDataSet.update(updates);
    }

    function toggleActiveRecall() {
      isActiveRecall = !isActiveRecall;
      document.getElementById('btn-recall').classList.toggle('active', isActiveRecall);
      const updates = nodesDataSet.get().map(node => ({
        id: node.id,
        label: isActiveRecall ? '❓ [Khái niệm]' : node.originalLabel
      }));
      nodesDataSet.update(updates);
    }

    function openDrawer(content) {
      document.getElementById('drawer-content').innerHTML = content || 'Không có chi tiết.';
      document.getElementById('drawer').classList.add('open');
    }
    function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

    function handleSearch(query) {
      if (!query.trim()) { applyModeRules(); return; }
      const matchedNode = nodesDataSet.get().find(n => n.originalLabel.toLowerCase().includes(query.toLowerCase()));
      if (matchedNode) {
        network.focus(matchedNode.id, { scale: 1.15, animation: { duration: 400 } });
        handleSingleClick(matchedNode.id);
      }
    }

    function resetView() { 
      currentRotation = 0; 
      applyRotation(0); 
      network.fit({ animation: { duration: 300 } }); 
      applyModeRules(); 
      closeDrawer(); 
    }
    
    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

    window.onload = initNetwork;
  </script>
</body>
</html>
